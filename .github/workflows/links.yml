name: links
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --exclude 'img\.shields\.io' --exclude 'x\.com' --exclude 'lmstudio\.ai'
            --exclude 'gitlab\.freedesktop\.org'
            README.md
          fail: true
